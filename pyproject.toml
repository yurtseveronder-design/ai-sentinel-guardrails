[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel-guardrails"
version = "0.1.0"
description = "Production-grade AI security gateway and input guardrails"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "PyYAML",
    "httpx"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "deepeval"
]

[project.scripts]
ai-sentinel = "ai_sentinel.cli:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]