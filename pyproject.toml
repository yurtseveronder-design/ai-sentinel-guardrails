[project]
name = "ai-sentinel-guardrails"
version = "1.0.0"
description = "AI Sentinel Guardrails and Security Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "PyYAML",
    "requests"
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "deepeval",
    "hypothesis"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "strict"