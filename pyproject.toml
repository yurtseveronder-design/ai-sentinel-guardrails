[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sentinel"
version = "0.1.0"
description = "Production-ready AI Security Gateway and LLM Guardrails"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0"
]

[project.scripts]
ai-sentinel = "ai_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]