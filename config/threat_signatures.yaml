rules:
  - id: prompt_injection_ignore
    phrase: "ignore previous instructions"
    description: "Detects prompt injection attempts to ignore previous guidelines."
  
  - id: prompt_override
    phrase: "system prompt override"
    description: "Detects attempts to override system configurations."

  - id: pii_email
    phrase: "test@example.com"
    description: "Detects standard test PII emails."

  - id: api_secret
    phrase: "sk-proj-"
    description: "Detects exposed OpenAI secret API keys."