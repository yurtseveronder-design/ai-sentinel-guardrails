rules:
  - id: "INJ-001"
    name: "Classic Ignore Instructions"
    pattern: "(?i)(ignore\\s*.*?previous\\s*instructions|disregard\\s*.*?prior\\s*guidelines)"
    severity: "high"
  - id: "INJ-002"
    name: "Roleplay Jailbreak"
    pattern: "(?i)(you\\s*are\\s*now\\s*DAN|do\\s*anything\\s*now|developer\\s*mode\\s*enabled)"
    severity: "high"
  - id: "INJ-003"
    name: "System Prompt Extraction"
    pattern: "(?i)(print\\s*.*?system\\s*prompt|reveal\\s*.*?initial\\s*instructions|show\\s*.*?hidden\\s*rules)"
    severity: "medium"