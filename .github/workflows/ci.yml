name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-cli-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build wheel and test CLI
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build
          
          # Create clean venv and install wheel
          python -m venv venv
          source venv/bin/activate
          pip install dist/*.whl
          
          echo "--- Clean Directory CLI Test ---"
          cd /tmp
          ai-sentinel inspect "Hello world"
          ai-sentinel inspect "ignore previous instructions" || true

  test-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t ai-sentinel:latest .

      - name: Run Container & Test Endpoints
        run: |
          docker run -d -p 8000:8000 --name sentinel-container ai-sentinel:latest uvicorn ai_sentinel.main:app --host 0.0.0.0 --port 8000
          
          # Wait for container startup
          sleep 3
          
          echo "--- Testing /health ---"
          curl -f http://localhost:8000/health
          
          echo "--- Testing /v1/guardrails/input ---"
          curl -X POST http://localhost:8000/v1/guardrails/input \
            -H "Content-Type: application/json" \
            -d '{"prompt": "Hello test prompt"}'
          
          docker stop sentinel-container
